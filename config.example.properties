# Copiá esta línea en local.properties (ese archivo no se sube al repositorio).
# URL base del servicio remoto. Debe terminar en "/".
#   - Emulador + servidor simulado en la misma computadora: http://10.0.2.2:8080/
#   - Teléfono físico en la misma red Wi-Fi: http://<IP-de-la-computadora>:8080/
#     (para HTTP a otra IP hay que agregarla en app/src/main/res/xml/network_security_config.xml)
# Este servicio no usa credenciales. Si en el futuro las necesitara, irían también en
# local.properties o en variables de entorno, nunca en el código fuente.
recordatorios.api.baseUrl=http://10.0.2.2:8080/
